name: Mirror to Azure DevOps

# Déclenche le miroir sur tout push de branche et tout push de tag.
# Les suppressions de branches/tags sont également propagées (comportement `--mirror`).
on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  delete:
  workflow_dispatch:

# Une seule exécution à la fois pour éviter les push concurrents qui se chevauchent.
concurrency:
  group: mirror-to-azure-devops
  cancel-in-progress: false

jobs:
  mirror:
    name: Push mirror to Azure Repos
    runs-on: ubuntu-latest

    steps:
      - name: Clone bare repository from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On clone en --mirror directement depuis GitHub : récupère toutes les refs
          # (branches, tags) sans checkout d'arbre de travail. Pas de conflit possible.
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo.git

      - name: Push mirror to Azure DevOps
        env:
          AZDO_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZDO_REPO_URL: ${{ secrets.AZURE_DEVOPS_REPO_URL }}
        run: |
          if [ -z "${AZDO_PAT}" ]; then
            echo "::error::Le secret AZURE_DEVOPS_PAT est vide ou manquant."
            exit 1
          fi
          if [ -z "${AZDO_REPO_URL}" ]; then
            echo "::error::Le secret AZURE_DEVOPS_REPO_URL est vide ou manquant."
            exit 1
          fi

          cd repo.git

          # Construit l'URL authentifiée. Le PAT est passé en HTTP Basic Auth.
          AUTH_URL="$(echo "${AZDO_REPO_URL}" | sed -E "s#https://#https://azdo:${AZDO_PAT}@#")"

          git remote add azure "${AUTH_URL}"

          # --mirror : pousse toutes les refs (branches, tags) et propage les suppressions.
          git push --mirror azure