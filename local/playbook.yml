---
# =============================================================================
# Althea-sys - Configuration des conteneurs via Ansible
# Les conteneurs sont provisionnes par Terraform, configures ici.
# Connexion via "ansible_connection=docker" (pas de SSH necessaire).
# =============================================================================

- name: Configure backend web container
  hosts: web
  gather_facts: false
  become: true
  vars:
    project_name: althea-sys
    environment_name: dev
  roles:
    - nginx-web

- name: Configure reverse proxy container
  hosts: proxy
  gather_facts: false
  become: true
  vars:
    backend_host: web
    backend_port: 80
  roles:
    - nginx-proxy
